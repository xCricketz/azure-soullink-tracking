<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#22305A"/><stop offset="1" stop-color="#0E1424"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Fisi half-ball (left) -->
  <g transform="translate(176 256)">
    <path d="M0,-110 A110,110 0 0 0 0,110 Z" fill="#EEF2FF"/>
    <path d="M0,-110 A110,110 0 0 0 -110,0 L0,0 Z" fill="#3FA9F5"/>
    <rect x="-110" y="-7" width="110" height="14" fill="#0E1424"/>
    <path d="M0,-110 A110,110 0 0 0 0,110" fill="none" stroke="#0E1424" stroke-width="10"/>
  </g>
  <!-- Seri half-ball (right) -->
  <g transform="translate(336 256)">
    <path d="M0,-110 A110,110 0 0 1 0,110 Z" fill="#EEF2FF"/>
    <path d="M0,-110 A110,110 0 0 1 110,0 L0,0 Z" fill="#FF6F91"/>
    <rect x="0" y="-7" width="110" height="14" fill="#0E1424"/>
    <path d="M0,-110 A110,110 0 0 1 0,110" fill="none" stroke="#0E1424" stroke-width="10"/>
  </g>
  <!-- chain link -->
  <g filter="url(#glow)" fill="none" stroke="#B98CFF" stroke-width="18" stroke-linecap="round">
    <rect x="168" y="226" width="96" height="60" rx="30"/>
    <rect x="248" y="226" width="96" height="60" rx="30"/>
  </g>
</svg>
