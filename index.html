<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E4F3FF" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Fisi's Tracker for Fisi and Seri · Pokémon Unbound" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fisi's Tracker" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <title>Fisi's Tracker · Pokémon Unbound</title>
    <style>
      html, body { margin: 0; background: #E4F3FF; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #070A14; }
    </style>
    <script>
      try {
        var choice = localStorage.getItem('sl-theme') || 'light'
        var dark = choice === 'dark' || (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
